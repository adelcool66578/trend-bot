name: Trend Bot

on:
  schedule:
    # Every 10 minutes: live prices + account value (never trades).
    # The daily trade check runs on the first of these after 21:30 UTC (after the US close),
    # and any later check catches up if that one was missed.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}        # "Run workflow" button for a manual check

permissions:
  contents: write              # lets the bot commit its state and dashboard

concurrency:
  group: trend-bot
  cancel-in-progress: false    # never run two cycles at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (stops here if anything is broken)
        run: python -m unittest discover -s tests

      - name: Live check (and the daily trade check when due)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m tradebot refresh

      - name: Save state and dashboard
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -q -m "Bot update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin main || true
            git push
          fi
