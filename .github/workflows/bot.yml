name: Trend Bot

on:
  workflow_dispatch:           # also the "Run workflow" button
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [refresh, test-alert]
        default: refresh
      source:
        description: "Who started it (chain = the bot's own 10-minute loop)"
        type: string
        default: manual
  schedule:
    # GitHub's own timer. On new repos it can take hours or days to start, so the bot
    # also keeps itself going: every run starts the next one about 10 minutes later.
    - cron: "*/10 * * * *"

permissions:
  contents: write              # commit state and the app's data
  actions: write               # start the next run of this workflow

concurrency:
  group: trend-bot
  cancel-in-progress: false    # never two checks at once; extra queued starts collapse into one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Note the start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (stops here if anything is broken)
        run: python -m unittest discover -s tests

      - name: Live check (and the daily trade check when due)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRIGGER_SOURCE: ${{ inputs.source || github.event_name }}
        run: python -m tradebot ${{ inputs.command || 'refresh' }}

      - name: Save state and dashboard
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -q -m "Bot update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          fi

      - name: Start the next check in about 10 minutes
        if: always() && (inputs.command || 'refresh') == 'refresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 570 - ( $(date +%s) - STARTED ) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          for i in 1 2 3; do
            gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main -f command=refresh -f source=chain && exit 0
            sleep 20
          done
          echo "could not start the next check" && exit 1
